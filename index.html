<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watcher Staff Control</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      padding: 20px 10px 60px;
    }
    button {
      display: block;
      width: 80%;
      max-width: 320px;
      margin: 10px auto;
      padding: 16px;
      font-size: 19px;
      border-radius: 10px;
      border: none;
      color: white;
      cursor: pointer;
    }
    #connectBtn { background: #444; }
    #calmBtn { background: #2a7fd6; }
    #wrathBtn { background: #c62828; }
    #divinityBtn { background: #9700CF; }
    #offBtn { background: #555; }
    #status { margin-top: 14px; color: #aaa; font-size: 14px; }

    #devToggle {
      background: #2e2e2e;
      color: #9c9;
      font-size: 14px;
      padding: 10px 16px;
      width: auto;
      display: inline-block;
    }
    #devPanel {
      display: none;
      max-width: 340px;
      margin: 20px auto 0;
      background: #161616;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: left;
    }
    #devPanel.open { display: block; }
    .devSection {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #262626;
    }
    .devSection:last-child { border-bottom: none; margin-bottom: 0; }
    .devLabel {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .row { margin-bottom: 12px; }
    .row label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #bbb;
      margin-bottom: 3px;
    }
    input[type=range] { width: 100%; }
    input[type=color] {
      width: 100%;
      height: 34px;
      border: none;
      border-radius: 6px;
      background: none;
      margin-bottom: 4px;
    }
    #stanceParams .hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Watcher Staff</h2>
  <button id="connectBtn" onclick="connect()">Connect</button>
  <button id="calmBtn" onclick="selectStance('1','calm')">Calm</button>
  <button id="wrathBtn" onclick="selectStance('2','wrath')">Wrath</button>
  <button id="divinityBtn" onclick="selectStance('3','divinity')">Divinity</button>
  <button id="offBtn" onclick="sendCommand('0')">Off</button>
  <div id="status">Not connected</div>

  <button id="devToggle" onclick="toggleDev()">Dev Mode: Off</button>

  <div id="devPanel">
    <div class="devSection">
      <div class="devLabel">Global</div>
      <div class="row">
        <label><span>Brightness</span><span id="brightVal">90</span></label>
        <input type="range" id="brightness" min="10" max="255" value="90" oninput="onBrightness(this.value)">
      </div>
      <div class="row">
        <label><span>Speed</span><span id="speedVal">1.0x</span></label>
        <input type="range" id="speed" min="10" max="300" value="100" oninput="onSpeed(this.value)">
      </div>
      <div class="row">
        <label><span>Color (applies to editing stance)</span><span></span></label>
        <input type="color" id="colorPick" value="#2ac8dc" oninput="onColor(this.value)">
      </div>
    </div>

    <div class="devSection" id="stanceParams">
      <div class="devLabel">Editing: <span id="editingLabel">Calm</span></div>
      <div class="hint">Selecting a stance button above also selects it here.</div>
      <div id="calmParams">
        <div class="row">
          <label><span>Closed Bias (sleepiness)</span><span id="c1Val">55</span></label>
          <input type="range" id="c1" min="0" max="100" value="55" oninput="onParam('C1', this.value, 'c1Val')">
        </div>
        <div class="row">
          <label><span>Eyelid Edge Softness</span><span id="c2Val">28</span></label>
          <input type="range" id="c2" min="10" max="50" value="28" oninput="onParam('C2', this.value, 'c2Val')">
        </div>
      </div>
      <div id="wrathParams" style="display:none;">
        <div class="row">
          <label><span>Center Whiteness</span><span id="w1Val">100</span></label>
          <input type="range" id="w1" min="0" max="200" value="100" oninput="onParam('W1', this.value, 'w1Val')">
        </div>
        <div class="row">
          <label><span>Crackle Intensity (min flicker)</span><span id="w2Val">30</span></label>
          <input type="range" id="w2" min="0" max="255" value="30" oninput="onParam('W2', this.value, 'w2Val')">
        </div>
      </div>
      <div id="divinityParams" style="display:none;">
        <div class="row">
          <label><span>Orb Radius</span><span id="d1Val">11.0</span></label>
          <input type="range" id="d1" min="50" max="300" value="110" oninput="onOrbRadius(this.value)">
        </div>
        <div class="row">
          <label><span>Orb Speed</span><span id="d2Val">4.0</span></label>
          <input type="range" id="d2" min="5" max="80" value="40" oninput="onOrbSpeed(this.value)">
        </div>
        <div class="row">
          <label><span>Vertical Dart Range</span><span id="d3Val">80</span></label>
          <input type="range" id="d3" min="20" max="80" value="80" oninput="onParam('D3', this.value, 'd3Val')">
        </div>
      </div>
    </div>
  </div>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHARACTERISTIC_UUID_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let rxCharacteristic = null;
let editingStance = 'calm';
let lastSendTime = 0;
const SEND_THROTTLE_MS = 120;

async function connect() {
  try {
    document.getElementById('status').innerText = 'Requesting device...';
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'WatcherStaff' }],
      optionalServices: [SERVICE_UUID]
    });

    document.getElementById('status').innerText = 'Connecting...';
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

    document.getElementById('status').innerText = 'Connected to ' + device.name;
  } catch (error) {
    document.getElementById('status').innerText = 'Connection failed: ' + error;
  }
}

async function sendCommand(cmd) {
  if (!rxCharacteristic) {
    document.getElementById('status').innerText = 'Not connected yet - tap Connect first';
    return;
  }
  try {
    const encoder = new TextEncoder();
    await rxCharacteristic.writeValue(encoder.encode(cmd));
  } catch (error) {
    document.getElementById('status').innerText = 'Send failed: ' + error;
  }
}

function throttledSend(cmd) {
  const now = Date.now();
  if (now - lastSendTime < SEND_THROTTLE_MS) return;
  lastSendTime = now;
  sendCommand(cmd);
}

function selectStance(cmd, name) {
  sendCommand(cmd);
  editingStance = name;
  document.getElementById('editingLabel').innerText = name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById('calmParams').style.display = name === 'calm' ? 'block' : 'none';
  document.getElementById('wrathParams').style.display = name === 'wrath' ? 'block' : 'none';
  document.getElementById('divinityParams').style.display = name === 'divinity' ? 'block' : 'none';

  const defaults = {
    calm: '#28c8dc',
    wrath: '#ff3232',
    divinity: '#e63cc8'
  };
  document.getElementById('colorPick').value = defaults[name];
}

function toggleDev() {
  const panel = document.getElementById('devPanel');
  const btn = document.getElementById('devToggle');
  panel.classList.toggle('open');
  btn.innerText = panel.classList.contains('open') ? 'Dev Mode: On' : 'Dev Mode: Off';
}

function onBrightness(val) {
  document.getElementById('brightVal').innerText = val;
  throttledSend('B' + val);
}

function onSpeed(val) {
  document.getElementById('speedVal').innerText = (val / 100).toFixed(1) + 'x';
  throttledSend('P' + val);
}

function onColor(hex) {
  const r = parseInt(hex.substring(1, 3), 16);
  const g = parseInt(hex.substring(3, 5), 16);
  const b = parseInt(hex.substring(5, 7), 16);
  throttledSend('R' + r + ',' + g + ',' + b);
}

function onParam(prefix, val, labelId) {
  document.getElementById(labelId).innerText = val;
  throttledSend(prefix + val);
}

function onOrbRadius(val) {
  document.getElementById('d1Val').innerText = (val / 10).toFixed(1);
  throttledSend('D1' + val);
}

function onOrbSpeed(val) {
  document.getElementById('d2Val').innerText = (val / 10).toFixed(1);
  throttledSend('D2' + val);
}
</script>
</body>
</html>
