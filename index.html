<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watcher Staff Control</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      padding: 20px 10px 60px;
    }
    button {
      display: block;
      width: 80%;
      max-width: 320px;
      margin: 10px auto;
      padding: 16px;
      font-size: 19px;
      border-radius: 10px;
      border: none;
      color: white;
      cursor: pointer;
    }
    #connectBtn { background: #444; }
    #calmBtn { background: #2a7fd6; }
    #wrathBtn { background: #c62828; }
    #divinityBtn { background: #9700CF; }
    #regentBtn { background: #cc7a10; }
    #offBtn { background: #555; }
    #status { margin-top: 14px; color: #aaa; font-size: 14px; }

    #devToggle {
      background: #2e2e2e;
      color: #9c9;
      font-size: 14px;
      padding: 10px 16px;
      width: auto;
      display: inline-block;
    }
    #devPanel {
      display: none;
      max-width: 340px;
      margin: 20px auto 0;
      background: #161616;
      border-radius: 12px;
      padding: 18px 20px;
      text-align: left;
    }
    #devPanel.open { display: block; }
    .devSection {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #262626;
    }
    .devSection:last-child { border-bottom: none; margin-bottom: 0; }
    .devLabel {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .row { margin-bottom: 12px; }
    .row label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #bbb;
      margin-bottom: 3px;
    }
    input[type=range] { width: 100%; }
    input[type=color] {
      width: 100%;
      height: 34px;
      border: none;
      border-radius: 6px;
      background: none;
      margin-bottom: 4px;
    }
    #stanceParams .hint {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }
    .smallBtnRow {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .smallBtn {
      flex: 1;
      display: block;
      margin: 0;
      padding: 10px 6px;
      font-size: 13px;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      background: #333;
    }
    .smallBtn.danger { background: #5a2a2a; }
    #exportBox {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      background: #0c0c0c;
      color: #8f8;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      height: 140px;
    }
    #exportMsg { font-size: 12px; color: #888; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>Watcher Staff</h2>
  <button id="connectBtn" onclick="connect()">Connect</button>
  <button id="calmBtn" onclick="selectStance('1','calm')">Calm</button>
  <button id="wrathBtn" onclick="selectStance('2','wrath')">Wrath</button>
  <button id="divinityBtn" onclick="selectStance('3','divinity')">Divinity</button>
  <button id="regentBtn" onclick="selectStance('4','regent')">Regent</button>
  <button id="offBtn" onclick="sendCommand('0')">Off</button>
  <div id="status">Not connected</div>

  <button id="devToggle" onclick="toggleDev()">Dev Mode: Off</button>

  <div id="devPanel">
    <div class="devSection">
      <div class="devLabel">Global</div>
      <div class="row">
        <label><span>Brightness</span><span id="brightVal">119</span></label>
        <input type="range" id="brightness" min="10" max="255" value="119" oninput="onGlobal('brightness', this.value)">
      </div>
      <div class="row">
        <label><span>Speed</span><span id="speedVal">1.0x</span></label>
        <input type="range" id="speed" min="10" max="300" value="100" oninput="onGlobal('speed', this.value)">
      </div>
      <div class="row">
        <label><span>Color (applies to editing stance)</span><span></span></label>
        <input type="color" id="colorPick" value="#2ac8dc" oninput="onColor(this.value)">
      </div>
    </div>

    <div class="devSection">
      <div class="devLabel" style="cursor:pointer;" onclick="togglePresets()">
        <span id="presetsCarrot">▶</span> Presets
      </div>
      <div id="presetsBody" style="display:none;">
        <div class="smallBtnRow">
          <button class="smallBtn" onclick="sendCommand('S')">💾 Save as Default</button>
          <button class="smallBtn" onclick="loadSavedDefault()">↩️ Load Saved</button>
        </div>
        <div class="smallBtnRow">
          <button class="smallBtn danger" onclick="factoryReset()">🏭 Factory Reset</button>
          <button class="smallBtn" onclick="exportSettings()">📋 Export Settings</button>
        </div>
        <textarea id="exportBox" readonly></textarea>
        <div id="exportMsg"></div>
      </div>
    </div>

    <div class="devSection" id="stanceParams">
      <div class="devLabel">Editing: <span id="editingLabel">Calm</span></div>
      <div class="hint">Selecting a stance button above also selects it here. "Save as Default" and "Load Saved" only work on the board and don't refresh these sliders - see the export/notes below.</div>

      <div id="calmParams">
        <div class="row">
          <label><span>Open Hold (ms)</span><span id="c1Val">2205</span></label>
          <input type="range" id="c1" min="0" max="3000" value="2205" oninput="onCalm('openHold', this.value, 'c1Val')">
        </div>
        <div class="row">
          <label><span>Closing Duration (ms)</span><span id="c2Val">1487</span></label>
          <input type="range" id="c2" min="100" max="3000" value="1487" oninput="onCalm('closing', this.value, 'c2Val')">
        </div>
        <div class="row">
          <label><span>Closed Hold (ms)</span><span id="c3Val">621</span></label>
          <input type="range" id="c3" min="0" max="3000" value="621" oninput="onCalm('closedHold', this.value, 'c3Val')">
        </div>
        <div class="row">
          <label><span>Opening Duration (ms)</span><span id="c4Val">1557</span></label>
          <input type="range" id="c4" min="100" max="3000" value="1557" oninput="onCalm('opening', this.value, 'c4Val')">
        </div>
        <div class="row">
          <label><span>Row Fade Blend</span><span id="c5Val">28</span></label>
          <input type="range" id="c5" min="0" max="100" value="28" oninput="onCalm('blend', this.value, 'c5Val')">
        </div>
        <div class="row">
          <label><span>Calm Brightness</span><span id="c6Val">255</span></label>
          <input type="range" id="c6" min="0" max="255" value="255" oninput="onCalm('brightness', this.value, 'c6Val')">
        </div>
      </div>

      <div id="wrathParams" style="display:none;">
        <div class="row">
          <label><span>Center Whiteness</span><span id="w1Val">100</span></label>
          <input type="range" id="w1" min="0" max="200" value="100" oninput="onWrath('whiteness', this.value, 'w1Val')">
        </div>
        <div class="row">
          <label><span>Crackle Intensity (min flicker)</span><span id="w2Val">88</span></label>
          <input type="range" id="w2" min="0" max="255" value="88" oninput="onWrath('crackle', this.value, 'w2Val')">
        </div>
        <div class="row">
          <label><span>Wrath Brightness</span><span id="w3Val">206</span></label>
          <input type="range" id="w3" min="0" max="255" value="206" oninput="onWrath('brightness', this.value, 'w3Val')">
        </div>
        <div class="row">
          <label><span>Wrath Speed</span><span id="w4Val">0.3x</span></label>
          <input type="range" id="w4" min="10" max="300" value="30" oninput="onWrath('speed', this.value, 'w4Val')">
        </div>
      </div>

      <div id="divinityParams" style="display:none;">
        <div class="row">
          <label><span>Orb Radius</span><span id="d1Val">9.1</span></label>
          <input type="range" id="d1" min="50" max="300" value="91" oninput="onDivinity('radius', this.value, 'd1Val')">
        </div>
        <div class="row">
          <label><span>Dart Ease</span><span id="d2Val">3.2</span></label>
          <input type="range" id="d2" min="5" max="80" value="32" oninput="onDivinity('ease', this.value, 'd2Val')">
        </div>
        <div class="row">
          <label><span>Vertical Dart Range</span><span id="d3Val">80</span></label>
          <input type="range" id="d3" min="20" max="80" value="80" oninput="onDivinity('vertRange', this.value, 'd3Val')">
        </div>
        <div class="row">
          <label><span>Divinity Brightness</span><span id="d4Val">255</span></label>
          <input type="range" id="d4" min="0" max="255" value="255" oninput="onDivinity('brightness', this.value, 'd4Val')">
        </div>
        <div class="row">
          <label><span>Divinity Speed</span><span id="d5Val">0.6x</span></label>
          <input type="range" id="d5" min="10" max="300" value="59" oninput="onDivinity('speed', this.value, 'd5Val')">
        </div>
      </div>

      <div id="regentParams" style="display:none;">
        <div class="row">
          <label><span>Rest Brightness</span><span id="g1Val">150</span></label>
          <input type="range" id="g1" min="0" max="255" value="150" oninput="onRegent('restBrightness', this.value, 'g1Val')">
        </div>
        <div class="row">
          <label><span>Sliver Brightness</span><span id="g2Val">230</span></label>
          <input type="range" id="g2" min="0" max="255" value="230" oninput="onRegent('sliverBrightness', this.value, 'g2Val')">
        </div>
        <div class="row">
          <label><span>Gather Window (ms)</span><span id="g3Val">2400</span></label>
          <input type="range" id="g3" min="200" max="4000" value="2400" oninput="onRegent('gather', this.value, 'g3Val')">
        </div>
        <div class="row">
          <label><span>Hold Duration (ms)</span><span id="g4Val">300</span></label>
          <input type="range" id="g4" min="0" max="2000" value="300" oninput="onRegent('hold', this.value, 'g4Val')">
        </div>
        <div class="row">
          <label><span>Release Duration (ms)</span><span id="g5Val">350</span></label>
          <input type="range" id="g5" min="100" max="1500" value="350" oninput="onRegent('release', this.value, 'g5Val')">
        </div>
        <div class="row">
          <label><span>Recover Duration (ms)</span><span id="g6Val">1400</span></label>
          <input type="range" id="g6" min="0" max="4000" value="1400" oninput="onRegent('recover', this.value, 'g6Val')">
        </div>
        <div class="row">
          <label><span>Regent Brightness</span><span id="g7Val">255</span></label>
          <input type="range" id="g7" min="0" max="255" value="255" oninput="onRegent('brightness', this.value, 'g7Val')">
        </div>
        <div class="row">
          <label><span>Regent Speed</span><span id="g8Val">1.0x</span></label>
          <input type="range" id="g8" min="10" max="300" value="100" oninput="onRegent('speed', this.value, 'g8Val')">
        </div>
      </div>
    </div>
  </div>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHARACTERISTIC_UUID_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let rxCharacteristic = null;
let bleDevice = null;
let heartbeatTimer = null;
let editingStance = 'calm';
let lastSendTime = 0;
let writeQueue = Promise.resolve();
let writeFailureCount = 0;
let pendingWrites = 0;
const SEND_THROTTLE_MS = 120;
const HEARTBEAT_INTERVAL_MS = 5000;

// Mirrors what this page has SENT to the board (assuming writes succeed).
// The BLE characteristic is write-only, so this is not a confirmed
// read-back of true device state - it's a best-effort local record used
// to keep sliders populated correctly when switching stances, and as the
// basis for the "Export Settings" text dump. If a write silently failed,
// this can drift from what's actually running on the board.
let settings = {
  global: { brightness: 119, speed: 100 },
  calm: {
    r: 40, g: 200, b: 220,
    openHold: 2205, closing: 1487, closedHold: 621, opening: 1557,
    blend: 28, brightness: 255
  },
  wrath: {
    r: 255, g: 50, b: 50,
    whiteness: 100, crackle: 88, brightness: 206, speed: 30
  },
  divinity: {
    r: 230, g: 60, b: 200,
    radius: 91, ease: 32, vertRange: 80, brightness: 255, speed: 59
  },
  regent: {
    r: 220, g: 110, b: 20,
    restBrightness: 150, sliverBrightness: 230,
    gather: 2400, hold: 300, release: 350, recover: 1400,
    brightness: 255, speed: 100
  }
};

async function connect() {
  try {
    document.getElementById('status').innerText = 'Requesting device...';
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'WatcherStaff' }],
      optionalServices: [SERVICE_UUID]
    });
    bleDevice = device;
    device.addEventListener('gattserverdisconnected', onDeviceDisconnected);

    document.getElementById('status').innerText = 'Connecting...';
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

    document.getElementById('status').innerText = 'Connected to ' + device.name;
    console.log(`[BLE] connected to ${device.name} at ${new Date().toISOString()}`);
    writeQueue = Promise.resolve();
    writeFailureCount = 0;
    startHeartbeat();
  } catch (error) {
    console.warn('[BLE] connect() failed:', error);
    document.getElementById('status').innerText = 'Connection failed: ' + error;
  }
}

function onDeviceDisconnected() {
  console.warn(`[BLE] gattserverdisconnected event fired at ${new Date().toISOString()}`);
  rxCharacteristic = null;
  stopHeartbeat();
  document.getElementById('status').innerText = 'Disconnected';
}

function startHeartbeat() {
  stopHeartbeat();
  heartbeatTimer = setInterval(() => {
    if (rxCharacteristic) {
      console.log('[BLE] heartbeat tick');
      sendCommand('H');
    } else {
      console.log('[BLE] heartbeat tick skipped - rxCharacteristic is null');
    }
  }, HEARTBEAT_INTERVAL_MS);
}

function stopHeartbeat() {
  if (heartbeatTimer) {
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
  }
}

function disconnectCleanly() {
  if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
    console.log('[BLE] disconnecting cleanly on unload/pagehide');
    bleDevice.gatt.disconnect();
  }
}
window.addEventListener('beforeunload', disconnectCleanly);
window.addEventListener('pagehide', disconnectCleanly);

async function sendCommand(cmd) {
  if (!rxCharacteristic) {
    document.getElementById('status').innerText = 'Not connected yet - tap Connect first';
    return;
  }
  pendingWrites++;
  console.log(`[BLE] enqueue "${cmd}" (queue depth now ${pendingWrites})`);
  writeQueue = writeQueue.then(() => doWrite(cmd));
  return writeQueue;
}

async function doWrite(cmd) {
  const startedAt = performance.now();
  try {
    const encoder = new TextEncoder();
    await rxCharacteristic.writeValue(encoder.encode(cmd));
    const ms = (performance.now() - startedAt).toFixed(1);
    console.log(`[BLE] sent "${cmd}" in ${ms}ms`);
    writeFailureCount = 0;
  } catch (error) {
    const ms = (performance.now() - startedAt).toFixed(1);
    writeFailureCount++;
    console.warn(`[BLE] FAILED "${cmd}" after ${ms}ms (failure #${writeFailureCount}): ${error}`);
    document.getElementById('status').innerText = 'Send failed: ' + error;
    const stillConnected = bleDevice && bleDevice.gatt && bleDevice.gatt.connected;
    if (writeFailureCount >= 4 || !stillConnected) {
      console.warn(`[BLE] giving up on connection (failures=${writeFailureCount}, stillConnected=${stillConnected})`);
      rxCharacteristic = null;
      stopHeartbeat();
    }
  } finally {
    pendingWrites--;
  }
}

function throttledSend(cmd) {
  const now = Date.now();
  if (now - lastSendTime < SEND_THROTTLE_MS) return;
  lastSendTime = now;
  sendCommand(cmd);
}

function selectStance(cmd, name) {
  sendCommand(cmd);
  editingStance = name;
  document.getElementById('editingLabel').innerText = name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById('calmParams').style.display = name === 'calm' ? 'block' : 'none';
  document.getElementById('wrathParams').style.display = name === 'wrath' ? 'block' : 'none';
  document.getElementById('divinityParams').style.display = name === 'divinity' ? 'block' : 'none';
  document.getElementById('regentParams').style.display = name === 'regent' ? 'block' : 'none';
  populateSlidersForStance(name);
}

// Populates the visible sliders from our local `settings` record, so
// switching stances shows what you actually last set for that stance
// rather than resetting to a guessed default.
function populateSlidersForStance(name) {
  const s = settings[name];
  const hexColor = '#' + [s.r, s.g, s.b].map(v => v.toString(16).padStart(2, '0')).join('');
  document.getElementById('colorPick').value = hexColor;

  if (name === 'calm') {
    setSlider('c1', s.openHold); setSlider('c2', s.closing);
    setSlider('c3', s.closedHold); setSlider('c4', s.opening);
    setSlider('c5', s.blend); setSlider('c6', s.brightness);
  } else if (name === 'wrath') {
    setSlider('w1', s.whiteness); setSlider('w2', s.crackle);
    setSlider('w3', s.brightness); setSliderSpeed('w4', s.speed);
  } else if (name === 'divinity') {
    setSlider('d1', s.radius); setSlider('d2', s.ease);
    setSlider('d3', s.vertRange); setSlider('d4', s.brightness);
    setSliderSpeed('d5', s.speed);
  } else if (name === 'regent') {
    setSlider('g1', s.restBrightness); setSlider('g2', s.sliverBrightness);
    setSlider('g3', s.gather); setSlider('g4', s.hold);
    setSlider('g5', s.release); setSlider('g6', s.recover);
    setSlider('g7', s.brightness); setSliderSpeed('g8', s.speed);
  }
}

function setSlider(id, value) {
  document.getElementById(id).value = value;
  document.getElementById(id + 'Val').innerText = (id === 'd1' || id === 'd2') ? (value / 10).toFixed(1) : value;
}
function setSliderSpeed(id, value) {
  document.getElementById(id).value = value;
  document.getElementById(id + 'Val').innerText = (value / 100).toFixed(1) + 'x';
}

function toggleDev() {
  const panel = document.getElementById('devPanel');
  const btn = document.getElementById('devToggle');
  panel.classList.toggle('open');
  btn.innerText = panel.classList.contains('open') ? 'Dev Mode: On' : 'Dev Mode: Off';
}

function togglePresets() {
  const body = document.getElementById('presetsBody');
  const carrot = document.getElementById('presetsCarrot');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  carrot.innerText = isOpen ? '▶' : '▼';
}

function onGlobal(field, val) {
  settings.global[field] = Number(val);
  if (field === 'brightness') {
    document.getElementById('brightVal').innerText = val;
    throttledSend('B' + val);
  } else if (field === 'speed') {
    document.getElementById('speedVal').innerText = (val / 100).toFixed(1) + 'x';
    throttledSend('P' + val);
  }
}

function onColor(hex) {
  const r = parseInt(hex.substring(1, 3), 16);
  const g = parseInt(hex.substring(3, 5), 16);
  const b = parseInt(hex.substring(5, 7), 16);
  settings[editingStance].r = r;
  settings[editingStance].g = g;
  settings[editingStance].b = b;
  throttledSend('R' + r + ',' + g + ',' + b);
}

function onCalm(field, val, labelId) {
  settings.calm[field] = Number(val);
  const prefixByField = { openHold: 'C1', closing: 'C2', closedHold: 'C3', opening: 'C4', blend: 'C5', brightness: 'C6' };
  document.getElementById(labelId).innerText = val;
  throttledSend(prefixByField[field] + val);
}

function onWrath(field, val, labelId) {
  settings.wrath[field] = Number(val);
  if (field === 'speed') {
    document.getElementById(labelId).innerText = (val / 100).toFixed(1) + 'x';
    throttledSend('W4' + val);
    return;
  }
  const prefixByField = { whiteness: 'W1', crackle: 'W2', brightness: 'W3' };
  document.getElementById(labelId).innerText = val;
  throttledSend(prefixByField[field] + val);
}

function onDivinity(field, val, labelId) {
  settings.divinity[field] = Number(val);
  if (field === 'radius' || field === 'ease') {
    document.getElementById(labelId).innerText = (val / 10).toFixed(1);
  } else if (field === 'speed') {
    document.getElementById(labelId).innerText = (val / 100).toFixed(1) + 'x';
  } else {
    document.getElementById(labelId).innerText = val;
  }
  const prefixByField = { radius: 'D1', ease: 'D2', vertRange: 'D3', brightness: 'D4', speed: 'D5' };
  throttledSend(prefixByField[field] + val);
}

function onRegent(field, val, labelId) {
  settings.regent[field] = Number(val);
  if (field === 'speed') {
    document.getElementById(labelId).innerText = (val / 100).toFixed(1) + 'x';
    throttledSend('G8' + val);
    return;
  }
  document.getElementById(labelId).innerText = val;
  const prefixByField = { restBrightness: 'G1', sliverBrightness: 'G2', gather: 'G3', hold: 'G4', release: 'G5', recover: 'G6', brightness: 'G7' };
  throttledSend(prefixByField[field] + val);
}

// ---------- Presets ----------
function loadSavedDefault() {
  sendCommand('L');
  document.getElementById('exportMsg').innerText =
    'Sent "load saved default" - the board has reverted, but these sliders can\'t auto-refresh (write-only connection). Reconnect or manually re-sync if you need the UI to match.';
}

function factoryReset() {
  if (!confirm('Reset the board to its original factory defaults? This does not affect anything already saved with "Save as Default".')) return;
  sendCommand('F');
  document.getElementById('exportMsg').innerText =
    'Sent "factory reset" - the board has reverted, but these sliders can\'t auto-refresh (write-only connection).';
}

function exportSettings() {
  const json = JSON.stringify(settings, null, 2);
  const box = document.getElementById('exportBox');
  box.value = json;
  box.style.display = 'block';
  box.focus();
  box.select();

  const msg = document.getElementById('exportMsg');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json)
      .then(() => { msg.innerText = 'Copied to clipboard. This reflects what this page has sent - if any writes failed, it may not exactly match the board.'; })
      .catch(() => { msg.innerText = 'Could not auto-copy - text is selected above, copy manually.'; });
  } else {
    msg.innerText = 'Text is selected above - copy manually.';
  }
}
</script>
</body>
</html>
